    <line x1="120" y1="0" x2="120" y2="675"/><line x1="180" y1="0" x2="180" y2="675"/>
    <line x1="240" y1="0" x2="240" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
  </g>
  <!-- Warning icon -->
  <g transform="translate(520, 200)">
    <path d="M80 0 L160 140 L0 140 Z" stroke="#ff6b6b" stroke-width="4" fill="none"/>
    <text x="80" y="100" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="60" font-weight="bold">!</text>
  </g>
  <!-- 87% text -->
  <text x="600" y="420" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-size="72" font-weight="bold">87%</text>
  <text x="600" y="480" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" opacity="0.7">AI Projects Fail</text>
