  <circle cx="100" cy="100" r="40" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="1100" cy="575" r="60" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.2"/>
