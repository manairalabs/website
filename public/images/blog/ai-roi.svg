<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0a1628"/>
  <defs>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#grad3)"/>
  <!-- Chart bars -->
  <g transform="translate(350, 200)">
    <rect x="0" y="180" width="80" height="120" fill="#00f0ff" opacity="0.4"/>
    <rect x="120" y="140" width="80" height="160" fill="#00f0ff" opacity="0.5"/>
    <rect x="240" y="80" width="80" height="220" fill="#00f0ff" opacity="0.6"/>
    <rect x="360" y="20" width="80" height="280" fill="#10b981" opacity="0.7"/>
    <!-- Trend line -->
    <path d="M40 180 L160 140 L280 80 L400 20" stroke="#ffffff" stroke-width="3" fill="none" stroke-dasharray="10,5"/>
  </g>
  <!-- ROI text -->
  <text x="600" y="500" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="56" font-weight="bold">AI ROI</text>
  <text x="600" y="550" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="24">Realistic Expectations</text>
  <!-- Dollar sign -->
  <g transform="translate(900, 150)">
    <circle cx="50" cy="50" r="45" stroke="#10b981" stroke-width="2" fill="none" opacity="0.5"/>
    <text x="50" y="70" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="48" font-weight="bold">$</text>
  </g>
  <!-- Decorative -->
  <circle cx="120" cy="550" r="70" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
