<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0a1628"/>
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#grad2)"/>
  <!-- Code brackets -->
  <g transform="translate(400, 180)">
    <text x="0" y="80" fill="#00f0ff" font-family="monospace" font-size="120" opacity="0.8">&lt;</text>
    <text x="300" y="80" fill="#00f0ff" font-family="monospace" font-size="120" opacity="0.8">/&gt;</text>
  </g>
  <!-- Chat bubbles -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="120" height="60" rx="10" fill="#00f0ff" opacity="0.3"/>
    <rect x="140" y="30" width="100" height="50" rx="10" fill="#7c3aed" opacity="0.3"/>
    <rect x="20" y="60" width="90" height="45" rx="10" fill="#00f0ff" opacity="0.2"/>
  </g>
  <!-- BicaraAI text -->
  <text x="600" y="450" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="48" font-weight="bold">BicaraAI</text>
  <text x="600" y="500" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-size="24">Case Study</text>
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="150" cy="150" r="60" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="1050" cy="525" r="100" stroke="#7c3aed" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
